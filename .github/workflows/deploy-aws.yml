# ═══════════════════════════════════════════════════════════════
#  AWS EC2 자동 배포 (CI/CD)
#  dev 브랜치에 push 되면 → EC2에 SSH 접속 → 최신 코드 받고 → 재배포
#
#  ▶ 필요한 GitHub Secrets (Settings → Secrets and variables → Actions):
#     EC2_HOST     : EC2 고정 IP (Elastic IP)
#     EC2_USER     : 접속 계정 (Ubuntu면 ubuntu)
#     EC2_SSH_KEY  : EC2 키페어(.pem) 내용 전체 붙여넣기
#
#  ※ 기존 GCP용 deploy.yml 은 그대로 두고 이 파일이 AWS용.
#    (GCP 안 쓰면 나중에 deploy.yml 지워도 됨)
# ═══════════════════════════════════════════════════════════════
name: Deploy to AWS EC2

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH로 EC2 접속해서 재배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/unName
            git fetch origin dev
            git reset --hard origin/dev
            cd deploy
            docker compose up -d --build
            docker compose ps
