# 애플리케이션 이름
spring.application.name=backend

# 서버 포트
server.port=8080

# MySQL 연결 정보
spring.datasource.url=jdbc:mysql://localhost:3306/bravodb
spring.datasource.username=testuser
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 설정
spring.jpa.hibernate.ddl-auto=update

# 실행 SQL 출력
spring.jpa.show-sql=true

# SQL 보기 좋게 출력
spring.jpa.properties.hibernate.format_sql=true

# 개발 편의 옵션
spring.jpa.open-in-view=false
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# JWT 설정
jwt.secret=bravo-unname-secret-key-must-be-at-least-32-characters
# 밀리초 단위라서 토큰 시간 설정 가능 지금은 하루로 잡아놓음 일단
# 86400000 → 24시간
# 3600000 → 1시간
# 604800000 → 7일
jwt.expiration=86400000
jwt.access-expiration=1800000
jwt.refresh-expiration=1209600000

# Redis 연결 정보
spring.data.redis.host=localhost
spring.data.redis.port=6379

# 파일 1개 최대 크기 (영수증 하나당 10MB 제한)
spring.servlet.multipart.max-file-size=10MB

# 요청 전체 최대 크기 (파일 + 나머지 값들 다 합쳐서. 파일보다 좀 여유있게)
spring.servlet.multipart.max-request-size=15MB