# 애플리케이션 이름
spring.application.name=backend

# 서버 포트
server.port=8080

# MySQL 연결 정보
spring.datasource.url=jdbc:mysql://localhost:3306/bravodb
spring.datasource.username=${DB_USERNAME:testuser}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 설정
spring.jpa.hibernate.ddl-auto=update

# 실행 SQL 출력
spring.jpa.show-sql=true

# SQL 보기 좋게 출력
spring.jpa.properties.hibernate.format_sql=true

# 개발 편의 옵션
spring.jpa.open-in-view=false
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# JWT 설정
jwt.secret=${JWT_SECRET:bravo-unname-secret-key-must-be-at-least-32-characters}
# 밀리초 단위라서 토큰 시간 설정 가능 지금은 하루로 잡아놓음 일단
# 86400000 → 24시간
# 3600000 → 1시간
# 604800000 → 7일
jwt.expiration=86400000
jwt.access-expiration=1800000
jwt.refresh-expiration=1209600000

# Redis 연결 정보
spring.data.redis.host=localhost
spring.data.redis.port=6379

# 파일 1개 최대 크기 (영수증 하나당 10MB 제한)
spring.servlet.multipart.max-file-size=10MB

# 요청 전체 최대 크기 (파일 + 나머지 값들 다 합쳐서. 파일보다 좀 여유있게)
spring.servlet.multipart.max-request-size=15MB

# 요청/응답 문자 인코딩을 UTF-8로 강제
# 이게 없으면 multipart(form-data) 텍스트 파트의 한글이 깨지거나 잘려서 저장될 수 있음
# (지출 수정 description 같은 필드에서 실제로 발생한 문제)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

file.base-url=http://localhost:8080

# LLM(Agent) 서버 연동
# base-url: LLM 서버 주소. 확정되면 이 값만 바꾸면 됨
# service-token: Authorization: Bearer 로 붙는 서비스 토큰 (LLM팀에게 받아야 함)
# timeout: LLM-005는 동기 응답이라 좀 넉넉하게 (마법사 화면에서 기다리는 시간)
# ⚠️ service-token은 비밀값입니다. 공개 저장소에 올리지 마세요.
#    가능하면 환경변수로 빼는 걸 권장: llm.service-token=${LLM_SERVICE_TOKEN:CHANGE_ME}
llm.base-url=${LLM_BASE_URL:http://34.50.39.240:8000}
# 실제 토큰은 커밋 금지 — 로컬에서 LLM 실호출 필요하면 환경변수 LLM_SERVICE_TOKEN 로 주입
llm.service-token=${LLM_SERVICE_TOKEN:CHANGE_ME}
llm.timeout-seconds=30

# LLM이 우리 백엔드를 부를 때(콜백 CB-001, 내부 API) 붙이는 Agent 서비스 토큰
# ⚠️ LLM팀과 값 합의 필요. 지금은 임시값 — 포스트맨 테스트 시 이 값을 Bearer로 보내면 됨
agent.service-token=CHANGE_ME_AGENT_TOKEN