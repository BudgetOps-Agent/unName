# ═══════════════════════════════════════════════════════════════
#  배포(prod) 전용 설정
#  - 로컬용 application.properties 는 그대로 두고, 배포 때만 이 프로필이 켜짐
#    (Dockerfile에서 SPRING_PROFILES_ACTIVE=prod 로 실행)
#  - 비밀값·주소는 전부 환경변수(${...})로 주입 → 코드/깃에 비밀값 안 남김
#    실제 값은 서버의 deploy/.env 파일에서 docker compose가 넣어줌
# ═══════════════════════════════════════════════════════════════

spring.application.name=backend
server.port=8080

# ── MySQL (compose의 mysql 컨테이너) ──────────────────────────
# DB_HOST 기본값 mysql = docker-compose 서비스명 (컨테이너끼리 이 이름으로 통신)
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:3306/${DB_NAME:bravodb}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ───────────────────────────────────────────────────────
# 지금은 로컬과 동일하게 update 유지 (엔티티 기준으로 테이블 자동 반영).
# 운영이 안정되면 validate로 바꾸고 마이그레이션 도구로 관리하는 걸 권장.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── Redis (compose의 redis 컨테이너) ──────────────────────────
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# ── 파일 업로드 크기 (로컬과 동일) ────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ── 인코딩 (한글 깨짐 방지, 로컬과 동일) ──────────────────────
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ── 파일 URL 베이스 (배포 도메인/IP) ──────────────────────────
# 예: http://<Elastic IP>  (nginx가 80으로 받아서 백엔드로 넘김)
file.base-url=${FILE_BASE_URL}

# ── JWT (비밀값 → 환경변수) ───────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.access-expiration=1800000
jwt.refresh-expiration=1209600000

# ── LLM 연동 (우리 → LLM) ─────────────────────────────────────
llm.base-url=${LLM_BASE_URL:http://34.50.39.240:8000}
llm.service-token=${LLM_SERVICE_TOKEN}
llm.timeout-seconds=30

# ── Agent 토큰 (LLM → 우리: 콜백·내부API 검증) ────────────────
agent.service-token=${AGENT_SERVICE_TOKEN}
