# ═══════════════════════════════════════════════════════════════
#  Nginx 리버스 프록시 (안내데스크)
#  바깥(80포트)으로 들어온 요청을 백엔드 컨테이너(8080)로 넘겨줌.
#  "backend" 는 docker-compose 서비스명 → 같은 네트워크에서 이 이름으로 통신.
# ═══════════════════════════════════════════════════════════════

upstream backend_app {
    server backend:8080;
}

# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    server_name bravobudget.duckdns.org;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (SSL 종료 후 백엔드로 넘김)
server {
    listen 443 ssl;
    server_name bravobudget.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/bravobudget.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bravobudget.duckdns.org/privkey.pem;

    # 영수증·회칙 파일 업로드가 최대 15MB라, 그보다 넉넉하게 20MB 허용
    client_max_body_size 20M;

    location / {
        proxy_pass http://backend_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM-005(마법사) 같은 동기 호출이 수 초 걸릴 수 있어 타임아웃 넉넉히
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}

# ═══════════════════════════════════════════════════════════════
#  api.budget-ops.site (신규 도메인)
#  프론트(budget-ops.site)와 같은 상위 도메인이라 쿠키가 1st-party로 취급됨
#  → iOS Safari의 제3자 쿠키 차단에 걸리지 않아 모바일 로그인 유지가 됨.
#  기존 bravobudget.duckdns.org 블록은 그대로 두어 언제든 롤백 가능.
# ═══════════════════════════════════════════════════════════════

# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    server_name api.budget-ops.site;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (SSL 종료 후 백엔드로 넘김)
server {
    listen 443 ssl;
    server_name api.budget-ops.site;

    ssl_certificate     /etc/letsencrypt/live/api.budget-ops.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.budget-ops.site/privkey.pem;

    # 영수증·회칙 파일 업로드가 최대 15MB라, 그보다 넉넉하게 20MB 허용
    client_max_body_size 20M;

    location / {
        proxy_pass http://backend_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM-005(마법사) 같은 동기 호출이 수 초 걸릴 수 있어 타임아웃 넉넉히
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
